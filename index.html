<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basset Solutions</title>

  <style>
    :root{
      --bg: #070A10;
      --text: #ffffff;
      --muted: rgba(255,255,255,.75);
      --accent: #00ffe1;
      --card: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.12);
    }

    *{ box-sizing: border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    /* Intro loader */
    #intro{
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: grid;
      align-items: center;
    }
    .intro-bar{
      height: 4px;
      width: 0%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      filter: drop-shadow(0 0 14px rgba(0,255,225,.6));
      animation: loading 1.1s ease forwards;
    }
    @keyframes loading{ to{ width: 100%; } }

    /* Hero */
    .hero{
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 80px 16px;
    }

    /* Canvas background */
    .bg-canvas{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Blobs */
    .blob{
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 999px;
      filter: blur(40px);
      opacity: .55;
      z-index: 1;
      mix-blend-mode: screen;
      pointer-events: none;
      background: radial-gradient(circle at 30% 30%, rgba(0,255,225,.9), rgba(0,255,225,0) 60%);
      animation: floaty 10s ease-in-out infinite;
    }
    .blob-1{ top: -140px; right: -160px; animation-duration: 12s; }
    .blob-2{
      bottom: -180px; left: -180px;
      background: radial-gradient(circle at 30% 30%, rgba(120,90,255,.9), rgba(120,90,255,0) 60%);
      animation-duration: 14s;
    }
    .blob-3{
      top: 25%; left: 60%;
      width: 360px; height: 360px;
      background: radial-gradient(circle at 30% 30%, rgba(255,80,180,.8), rgba(255,80,180,0) 60%);
      animation-duration: 16s;
    }

    @keyframes floaty{
      0%   { transform: translate3d(0,0,0) scale(1); }
      50%  { transform: translate3d(30px, -22px, 0) scale(1.06); }
      100% { transform: translate3d(0,0,0) scale(1); }
    }

    /* Overlay readability */
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      background: radial-gradient(60% 60% at 50% 35%, rgba(0,0,0,.15), rgba(0,0,0,.72));
      pointer-events:none;
    }

    /* Content */
    .hero-content{
      position: relative;
      z-index: 3;
      width: min(980px, 92vw);
      text-align: center;
      padding: 28px 18px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 80px rgba(0,0,0,.45);
    }

    .hero-content h1{
      font-size: clamp(2rem, 4.8vw, 3.6rem);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .hero-content p{
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      color: var(--muted);
      margin-bottom: 22px;
    }

    .actions{
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid transparent;
      background: var(--accent);
      color: #00110d;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0,255,225,.18);
    }
    .btn.ghost{
      background: transparent;
      border-color: rgba(255,255,255,.22);
      color: var(--text);
    }
    .btn.ghost:hover{ opacity: .9; }

    /* Sections */
    .section{
      padding: 70px 16px;
      width: min(980px, 92vw);
      margin: 0 auto;
    }
    .section h2{ font-size: 1.6rem; margin-bottom: 10px; }
    .section p{ color: var(--muted); }

    @media (max-width: 768px){
      .hero-content{ padding: 22px 14px; }
      .blob{ width: 420px; height: 420px; opacity: .45; }
    }
  </style>
</head>

<body>
  <!-- Intro Loader -->
  <div id="intro" aria-hidden="true">
    <div class="intro-bar"></div>
  </div>

  <main class="hero" id="top">
    <canvas id="bg" class="bg-canvas"></canvas>

    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <div class="hero-content">
      <h1>نُبسّط التعقيد</h1>
      <p>حلول رقمية ذكية بتجربة تفاعلية سلسة</p>

      <div class="actions">
        <a class="btn" href="#contact">تواصل معنا</a>
        <a class="btn ghost" href="#services">خدماتنا</a>
      </div>
    </div>
  </main>

  <section id="services" class="section">
    <h2>الخدمات</h2>
    <p>اكتب محتواك هنا…</p>
  </section>

  <section id="contact" class="section">
    <h2>تواصل</h2>
    <p>اكتب بيانات التواصل هنا…</p>
  </section>

  <script>
    // Intro loader hide
    window.addEventListener("load", () => {
      const intro = document.getElementById("intro");
      setTimeout(() => {
        intro.style.opacity = "0";
        intro.style.transition = "opacity .35s ease";
        setTimeout(() => intro.remove(), 380);
      }, 1100);
    });

    // Canvas particles background
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d", { alpha: true });

    let w = 0, h = 0;
    let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    let particles = [];
    let rafId = null;

    function makeParticle() {
      const speed = 0.15 + Math.random() * 0.45;
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.8 + Math.random() * 2.2,
        vx: (Math.random() - 0.5) * speed,
        vy: (Math.random() - 0.5) * speed,
        a: 0.25 + Math.random() * 0.45
      };
    }

    function resize() {
      w = canvas.clientWidth;
      h = canvas.clientHeight;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.floor((w * h) / 18000);
      const n = Math.max(35, Math.min(140, count));
      particles = Array.from({ length: n }, makeParticle);
    }

    function step() {
      ctx.clearRect(0, 0, w, h);

      const g = ctx.createRadialGradient(w * 0.5, h * 0.35, 40, w * 0.5, h * 0.5, Math.max(w, h));
      g.addColorStop(0, "rgba(0,255,225,0.06)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;

        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${p.a})`;
        ctx.fill();
      }

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            const alpha = (1 - dist / 120) * 0.18;
            ctx.strokeStyle = `rgba(0,255,225,${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      rafId = requestAnimationFrame(step);
    }

    const ro = new ResizeObserver(resize);
    ro.observe(canvas);

    resize();
    step();

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      } else if (!rafId) {
        step();
      }
    });
  </script>
</body>
</html>
