<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basset Solutions</title>

  <!-- Spline Viewer -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.39/build/spline-viewer.js"></script>

  <style>
    :root{
      --bg: #070A10;
      --text: #ffffff;
      --muted: rgba(255,255,255,.78);
      --accent: #00ffe1;
    }

    *{ box-sizing: border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    /* Loader */
    #intro{
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: grid;
      align-items: center;
    }
    .intro-bar{
      height: 4px;
      width: 0%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      filter: drop-shadow(0 0 14px rgba(0,255,225,.6));
      animation: loading 1.05s ease forwards;
    }
    @keyframes loading{ to{ width: 100%; } }

    /* HERO */
    .hero{
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 86px 16px;
      background: var(--bg);
    }

    /* Spline background */
    .spline-bg{
      position: absolute;
      inset: 0;
      z-index: 0;
      /* لو تبغى توقف تفاعل/تحريك السبلين بالماوس، فعّل هذا السطر:
      pointer-events: none;
      */
    }

    .spline-bg spline-viewer{
      width: 100%;
      height: 100%;
      display: block;

      /* إخفاء حواف “المربع الكبير” بتلاشي ناعم */
      -webkit-mask-image: radial-gradient(circle at 50% 55%, #000 56%, transparent 78%);
      mask-image: radial-gradient(circle at 50% 55%, #000 56%, transparent 78%);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 150% 150%;
      mask-size: 150% 150%;
      -webkit-mask-position: center;
      mask-position: center;
    }

    /* Overlay ناعم (بدون أي مستطيلات) لتحسين قراءة النص */
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        radial-gradient(1200px 820px at 60% 45%, rgba(0,255,225,.10), rgba(0,0,0,0) 60%),
        radial-gradient(900px 620px at 40% 65%, rgba(120,90,255,.10), rgba(0,0,0,0) 65%),
        linear-gradient(to bottom, rgba(7,10,16,.10), rgba(7,10,16,.78));
    }

    /* Content (صافي بدون حدود) */
    .hero-content{
      position: relative;
      z-index: 5; /* فوق السبلين وفوق الـ overlay */
      width: min(980px, 92vw);
      text-align: center;
      padding: 18px 12px;

      /* صافي */
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
    }

    .hero-content h1{
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.15;
      margin-bottom: 12px;
      text-shadow: 0 10px 40px rgba(0,0,0,.55);
    }

    .hero-content p{
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      color: var(--muted);
      margin-bottom: 22px;
      text-shadow: 0 10px 36px rgba(0,0,0,.45);
    }

    .actions{
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      border: 1px solid transparent;
      background: var(--accent);
      color: #00110d;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0,255,225,.18);
    }
    .btn.ghost{
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.18);
      color: var(--text);
      backdrop-filter: blur(10px);
    }
    .btn.ghost:hover{ opacity: .92; }

    /* Sections (اختياري) */
    .section{
      padding: 70px 16px;
      width: min(980px, 92vw);
      margin: 0 auto;
    }
    .section h2{ font-size: 1.6rem; margin-bottom: 10px; }
    .section p{ color: var(--muted); }

    @media (max-width: 768px){
      .hero{ padding: 74px 14px; }
      .hero-content{ padding: 14px 10px; }
      .spline-bg spline-viewer{
        -webkit-mask-size: 180% 180%;
        mask-size: 180% 180%;
      }
    }
  </style>
</head>

<body>
  <!-- Loader -->
  <div id="intro" aria-hidden="true">
    <div class="intro-bar"></div>
  </div>

  <!-- HERO -->
  <main class="hero" id="top">
    <div class="spline-bg" aria-hidden="true">
      <spline-viewer url="https://prod.spline.design/ZR2WxfJjPCiqjnFt/scene.splinecode"></spline-viewer>
    </div>

    <div class="hero-content">
      <h1>نُبسّط التعقيد</h1>
      <p>واجهة حديثة بحركة ثلاثية الأبعاد — بدون ثيم فضاء</p>

      <div class="actions">
        <a class="btn" href="#contact">تواصل معنا</a>
        <a class="btn ghost" href="#services">خدماتنا</a>
      </div>
    </div>
  </main>

  <section id="services" class="section">
    <h2>الخدمات</h2>
    <p>اكتب محتواك هنا…</p>
  </section>

  <section id="contact" class="section">
    <h2>تواصل</h2>
    <p>اكتب محتواك هنا…</p>
  </section>

  <script>
    // hide loader
    window.addEventListener("load", () => {
      const intro = document.getElementById("intro");
      setTimeout(() => {
        intro.style.opacity = "0";
        intro.style.transition = "opacity .35s ease";
        setTimeout(() => intro.remove(), 380);
      }, 1050);
    });
  </script>
</body>
</html>
