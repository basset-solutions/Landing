<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basset Solutions</title>

  <style>
    :root{
      --bg: #070A10;
      --text: #ffffff;
      --muted: rgba(255,255,255,.75);
      --accent: #00ffe1;
      --card: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.12);
    }

    *{ box-sizing: border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    /* Intro loader */
    #intro{
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: grid;
      align-items: center;
    }
    .intro-bar{
      height: 4px;
      width: 0%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      filter: drop-shadow(0 0 14px rgba(0,255,225,.6));
      animation: loading 1.1s ease forwards;
    }
    @keyframes loading{ to{ width: 100%; } }

    /* Hero */
    .hero{
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 80px 16px;
    }

    /* Canvas background */
    .bg-canvas{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Blobs */
    .blob{
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 999px;
      filter: blur(40px);
      opacity: .55;
      z-index: 1;
      mix-blend-mode: screen;
      pointer-events: none;
      background: radial-gradient(circle at 30% 30%, rgba(0,255,225,.9), rgba(0,255,225,0) 60%);
      animation: floaty 10s ease-in-out infinite;
    }
    .blob-1{ top: -140px; right: -160px; animation-duration: 12s; }
    .blob-2{
      bottom: -180px; left: -180px;
      background: radial-gradient(circle at 30% 30%, rgba(120,90,255,.9), rgba(120,90,255,0) 60%);
      animation-duration: 14s;
    }
    .blob-3{
      top: 25%; left: 60%;
      width: 360px; height: 360px;
      background: radial-gradient(circle at 30% 30%, rgba(255,80,180,.8), rgba(255,80,180,0) 60%);
      animation-duration: 16s;
    }
    @keyframes floaty{
      0%   { transform: translate3d(0,0,0) scale(1); }
      50%  { transform: translate3d(30px, -22px, 0) scale(1.06); }
      100% { transform: translate3d(0,0,0) scale(1); }
    }

    /* Overlay readability */
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      background: radial-gradient(60% 60% at 50% 35%, rgba(0,0,0,.15), rgba(0,0,0,.72));
      pointer-events:none;
    }

    /* ===== Layout (content + 3D object) ===== */
    .hero-grid{
      position: relative;
      z-index: 3;
      width: min(1100px, 92vw);
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 18px;
      align-items: center;
    }
    @media (max-width: 900px){
      .hero-grid{ grid-template-columns: 1fr; gap: 14px; }
    }

    /* Content card */
    .hero-content{
      text-align: center;
      padding: 28px 18px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 80px rgba(0,0,0,.45);
    }
    .hero-content h1{
      font-size: clamp(2rem, 4.8vw, 3.6rem);
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .hero-content p{
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      color: var(--muted);
      margin-bottom: 22px;
    }

    .actions{
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      border: 1px solid transparent;
      background: var(--accent);
      color: #00110d;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0,255,225,.18);
    }
    .btn.ghost{
      background: transparent;
      border-color: rgba(255,255,255,.22);
      color: var(--text);
    }
    .btn.ghost:hover{ opacity: .9; }

    /* ===== 3D object stage ===== */
    .stage{
      display: grid;
      place-items: center;
      height: 520px;
    }
    @media (max-width: 900px){
      .stage{ height: 420px; }
    }

    .card3d{
      position: relative;
      width: min(420px, 86vw);
      height: 420px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.16);
      background: radial-gradient(120% 120% at 20% 10%, rgba(0,255,225,.16), rgba(255,255,255,.04), rgba(0,0,0,.2));
      box-shadow: 0 30px 120px rgba(0,0,0,.55);
      transform-style: preserve-3d;
      will-change: transform;
      overflow: hidden;
    }

    .card3d-glow{
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at 30% 30%, rgba(0,255,225,.55), rgba(120,90,255,.25), rgba(0,0,0,0) 60%);
      filter: blur(22px);
      transform: translateZ(40px);
      opacity: .65;
    }

    .card3d-sheen{
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, rgba(255,255,255,.10), rgba(255,255,255,0) 35%, rgba(255,255,255,.08));
      transform: translateZ(60px);
      opacity: .55;
      mix-blend-mode: screen;
    }

    .ring{
      position: absolute;
      inset: 22%;
      border-radius: 999px;
      border: 1px solid rgba(0,255,225,.35);
      box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset;
      transform-style: preserve-3d;
      transform: translateZ(80px) rotateX(70deg);
      filter: drop-shadow(0 0 18px rgba(0,255,225,.18));
    }
    .ring-1{ inset: 18%; opacity: .85; }
    .ring-2{
      inset: 28%;
      border-color: rgba(120,90,255,.35);
      opacity: .75;
      transform: translateZ(60px) rotateX(62deg) rotateZ(25deg);
    }
    .ring-3{
      inset: 38%;
      border-color: rgba(255,80,180,.25);
      opacity: .65;
      transform: translateZ(40px) rotateX(58deg) rotateZ(-18deg);
    }

    .core{
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140px;
      height: 140px;
      border-radius: 999px;
      transform: translate(-50%, -50%) translateZ(120px);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(0,255,225,.55), rgba(0,0,0,.0) 65%);
      box-shadow: 0 0 60px rgba(0,255,225,.22), 0 0 120px rgba(120,90,255,.10);
    }

    .dots{
      position: absolute;
      inset: 0;
      transform: translateZ(20px);
      opacity: .35;
      background-image: radial-gradient(rgba(255,255,255,.35) 1px, rgba(0,0,0,0) 1px);
      background-size: 18px 18px;
      mask-image: radial-gradient(circle at 60% 40%, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 68%);
    }

    @media (prefers-reduced-motion: no-preference){
      .card3d{ animation: floatCard 6.5s ease-in-out infinite; }
      @keyframes floatCard{
        0%,100%{ transform: rotateX(0deg) rotateY(0deg) translateY(0); }
        50%{ transform: rotateX(2deg) rotateY(-3deg) translateY(-8px); }
      }
      .ring-1{ animation: spin1 7s linear infinite; }
      .ring-2{ animation: spin2 9s linear infinite; }
      .ring-3{ animation: spin3 11s linear infinite; }
      @keyframes spin1{ to{ transform: translateZ(80px) rotateX(70deg) rotateZ(360deg); } }
      @keyframes spin2{ to{ transform: translateZ(60px) rotateX(62deg) rotateZ(-360deg); } }
      @keyframes spin3{ to{ transform: translateZ(40px) rotateX(58deg) rotateZ(360deg); } }
    }

    /* Sections */
    .section{
      padding: 70px 16px;
      width: min(980px, 92vw);
      margin: 0 auto;
    }
    .section h2{ font-size: 1.6rem; margin-bottom: 10px; }
    .section p{ color: var(--muted); }

    @media (max-width: 768px){
      .hero-content{ padding: 22px 14px; }
      .blob{ width: 420px; height: 420px; opacity: .45; }
    }
  </style>
</head>

<body>
  <!-- Intro Loader -->
  <div id="intro" aria-hidden="true">
    <div class="intro-bar"></div>
  </div>

  <main class="hero" id="top">
    <canvas id="bg" class="bg-canvas"></canvas>

    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <div class="hero-grid">
      <div class="hero-content">
        <h1>نُبسّط التعقيد</h1>
        <p>تجربة واجهة حديثة مع حركة “3D feel” — بدون Spline</p>

        <div class="actions">
          <a class="btn" href="#contact">تواصل معنا</a>
          <a class="btn ghost" href="#services">خدماتنا</a>
        </div>
      </div>

      <div class="stage" aria-hidden="true">
        <div class="card3d" id="card3d">
          <div class="card3d-glow"></div>
          <div class="card3d-sheen"></div>

          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>

          <div class="core"></div>
          <div class="dots"></div>
        </div>
      </div>
    </div>
  </main>

  <section id="services" class="section">
    <h2>الخدمات</h2>
    <p>اكتب محتواك هنا…</p>
  </section>

  <section id="contact" class="section">
    <h2>تواصل</h2>
    <p>اكتب بيانات التواصل هنا…</p>
  </section>

  <script>
    // Intro loader hide
    window.addEventListener("load", () => {
      const intro = document.getElementById("intro");
      setTimeout(() => {
        intro.style.opacity = "0";
        intro.style.transition = "opacity .35s ease";
        setTimeout(() => intro.remove(), 380);
      }, 1100);
    });

    // ===== Canvas particles background =====
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d", { alpha: true });

    let w = 0, h = 0;
    let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    let particles = [];
    let rafId = null;

    function makeParticle() {
      const speed = 0.15 + Math.random() * 0.45;
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.8 + Math.random() * 2.2,
        vx: (Math.random() - 0.5) * speed,
        vy: (Math.random() - 0.5) * speed,
        a: 0.25 + Math.random() * 0.45
      };
    }

    function resize() {
      w = canvas.clientWidth;
      h = canvas.clientHeight;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.floor((w * h) / 18000);
      const n = Math.max(35, Math.min(140, count));
      particles = Array.from({ length: n }, makeParticle);
    }

    function step() {
      ctx.clearRect(0, 0, w, h);

      // subtle glow vignette
      const g = ctx.createRadialGradient(w * 0.5, h * 0.35, 40, w * 0.5, h * 0.5, Math.max(w, h));
      g.addColorStop(0, "rgba(0,255,225,0.06)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // particles
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;

        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${p.a})`;
        ctx.fill();
      }

      // connections
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            const alpha = (1 - dist / 120) * 0.18;
            ctx.strokeStyle = `rgba(0,255,225,${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      rafId = requestAnimationFrame(step);
    }

    const ro = new ResizeObserver(resize);
    ro.observe(canvas);

    resize();
    step();

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      } else if (!rafId) {
        step();
      }
    });

    // ===== 3D parallax for the object (mouse + touch) =====
    const card = document.getElementById("card3d");

    function setTilt(clientX, clientY) {
      const r = card.getBoundingClientRect();
      const x = (clientX - r.left) / r.width;   // 0..1
      const y = (clientY - r.top) / r.height;  // 0..1
      const rotY = (x - 0.5) * 18;
      const rotX = (0.5 - y) * 14;
      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    if (card) {
      window.addEventListener("mousemove", (e) => {
        const r = card.getBoundingClientRect();
        if (r.bottom < 0 || r.top > window.innerHeight) return;
        setTilt(e.clientX, e.clientY);
      });

      window.addEventListener("touchmove", (e) => {
        if (!e.touches?.length) return;
        const t = e.touches[0];
        setTilt(t.clientX, t.clientY);
      }, { passive: true });

      window.addEventListener("mouseleave", () => {
        card.style.transform = "rotateX(0deg) rotateY(0deg)";
      });
    }
  </script>
</body>
</html>
