<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Basset Solutions 3D Hero</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #070A10;
      color: #fff;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 0 20px;
    }

    #three-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .hero-text {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      margin-bottom: 12px;
      text-shadow: 0 10px 28px rgba(0,0,0,.6);
    }
    p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      margin-bottom: 24px;
      opacity: .9;
      text-shadow: 0 8px 26px rgba(0,0,0,.45);
    }

    .btn {
      display: inline-block;
      margin: 0 8px;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: .2s ease;
    }
    .btn-primary {
      background: #00ffe1;
      color: #00110d;
    }
    .btn-secondary {
      border: 2px solid #fff;
      color: #fff;
    }
    .btn:hover {
      transform: translateY(-2px);
      opacity: .92;
    }
  </style>
</head>

<body>

  <div class="hero">
    <!-- 3D Canvas -->
    <canvas id="three-canvas"></canvas>

    <!-- Text Content -->
    <div class="hero-text">
      <h1>نُبسّط التعقيد</h1>
      <p>واجهة حديثة بحركة ثلاثية الأبعاد — بدون أداة Spline</p>
      <a class="btn btn-primary" href="#contact">تواصل معنا</a>
      <a class="btn btn-secondary" href="#services">خدماتنا</a>
    </div>
  </div>

  <!-- Three.js -->
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const canvas = document.getElementById("three-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.3, 7);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffffff, 0.85);
    key.position.set(3, 4, 3);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x00ffe1, 0.38);
    fill.position.set(-3, -1.5, 2.8);
    scene.add(fill);

    // Materials
    const mat1 = new THREE.MeshStandardMaterial({
      color: 0x00ffe1,
      metalness: 0.3,
      roughness: 0.35,
      emissive: 0x00231a,
      emissiveIntensity: 0.45
    });

    const mat2 = mat1.clone();
    mat2.color = new THREE.Color(0x7a5aff);

    const mat3 = mat1.clone();
    mat3.color = new THREE.Color(0xff50b4);

    // Group
    const group = new THREE.Group();
    scene.add(group);

    function makeTorus(radius, tube, mat, rx, ry) {
      const geo = new THREE.TorusGeometry(radius, tube, 28, 120);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = rx;
      mesh.rotation.y = ry;
      return mesh;
    }

    const tor1 = makeTorus(1.5, 0.1, mat1, Math.PI * 0.45, 0);
    const tor2 = makeTorus(1.2, 0.1, mat2, Math.PI * 0.38, Math.PI * 0.23);
    const tor3 = makeTorus(0.9, 0.1, mat3, Math.PI * 0.52, -Math.PI * 0.18);

    group.add(tor1, tor2, tor3);

    function animate() {
      tor1.rotation.z += 0.009;
      tor2.rotation.z -= 0.011;
      tor3.rotation.z += 0.013;

      group.rotation.y += 0.0025;
      group.rotation.x += 0.0018;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
  </script>

</body>
</html>
